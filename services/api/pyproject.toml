[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rabmate-api"
version = "0.1.0"
description = "RABmate AI backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.144,<0.145",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic[email]>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy>=2.1,<2.2",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.3,<3.4",
    "argon2-cffi>=25.1,<26",
    "python-multipart>=0.0.32,<0.1",
    "openpyxl>=3.1.5,<3.2",
    "reportlab>=5.0.1,<5.1",
    "httpx2>=2.13,<3",  # local AI agent client; also the Starlette TestClient transport
    "pypdf>=6.21,<7",  # reads uploaded PDFs (and generated PDFs back in tests)
    "pillow>=13,<14",  # decodes scanned pages and images for OCR
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
    "types-openpyxl>=3.1.5,<3.2",
    "types-reportlab>=5.0,<5.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the idiomatic pattern

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make ruff treat it as first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# SQLAlchemy declarative `__mapper_args__` is a plain class dict by convention.
"app/modules/*/models.py" = ["RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: needs the PostgreSQL test database; deselect with -m 'not db'",
]
filterwarnings = ["error::DeprecationWarning:app.*"]
